<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacebook — Verifying...</title>
  <link rel="stylesheet" href="/demo/shared.css">
  <link rel="stylesheet" href="/demo/spacebook/spacebook.css">
</head>
<body>
  <div class="demo-banner">
    <strong>JustAge Demo</strong> — Callback page: verifying the credential received from the issuer.

  <div class="spacebook-page">

      <div class="spacebook-logo">Space<span>book</span></div>

    <div id="status" style="text-align: center; padding: 2rem 0;">

      <p style="margin-top: 1rem; color: var(--c-text-dim); font-size: var(--fs-sm);">

      </p>
    </div>
  </div>

  <script src="/demo/spacebook/spacebook.js"></script>
